<!doctype html>
<html lang="tr" data-composition-variables='[
  {"id": "events", "type": "string", "label": "Events, max 5 (a list in the storyboard: {when, what} or plain text)", "default": "[{\"when\": \"1. adım\", \"what\": \"Ev sahibi ihtiyacını bildirir\"}, {\"when\": \"2. adım\", \"what\": \"Tahliye davası açılır\"}, {\"when\": \"3. adım\", \"what\": \"Mahkeme ihtiyacı inceler\"}, {\"when\": \"4. adım\", \"what\": \"Karar: tahliye ya da ret\"}]"},
  {"id":"active","type":"number","label":"Event to emphasize at the end (1-5, 0 = none)","default":4},
  {"id":"cue_e1","type":"number","label":"Event 1 time (s)","default":0.5},
  {"id":"cue_e2","type":"number","label":"Event 2 time (s)","default":1.6},
  {"id":"cue_e3","type":"number","label":"Event 3 time (s)","default":2.7},
  {"id":"cue_e4","type":"number","label":"Event 4 time (s)","default":3.8},
  {"id":"cue_e5","type":"number","label":"Event 5 time (s)","default":4.9},
  {"id":"duration","type":"number","label":"Scene length (s)","default":6},
  {"id":"ink","type":"color","label":"Ink","default":"#1b2a41"},
  {"id":"surface","type":"color","label":"Card","default":"#fbf7ee"},
  {"id":"accent","type":"color","label":"Accent","default":"#b58a3c"},
  {"id":"muted","type":"color","label":"Muted","default":"#8c8677"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=940, height=720" />
    <link rel="stylesheet" href="assets/kettek.css" />
    <script src="assets/gsap.min.js"></script>
    <style>
      #stage { position: absolute; inset: 0; }
      #track { position: absolute; left: 118px; top: 40px; width: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 14%, transparent); }
      #fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 3px; background: var(--ink); transform-origin: 50% 0%; }
      .ev { position: absolute; left: 70px; right: 30px; height: 120px; display: flex; align-items: center; }
      .dot {
        position: relative; flex: 0 0 auto; width: 102px; height: 102px; border-radius: 50%;
        background: var(--surface); border: 6px solid var(--ink);
        display: flex; align-items: center; justify-content: center;
        font-family: var(--serif); font-weight: 800; font-size: 40px; color: var(--ink);
      }
      .ring { position: absolute; inset: -16px; border-radius: 50%; border: 5px solid var(--accent); opacity: 0; }
      .txt { margin-left: 34px; }
      .when { font-family: var(--mono); font-size: 24px; letter-spacing: 5px; color: color-mix(in srgb, var(--accent) 75%, var(--ink)); margin-bottom: 6px; }
      .what { font-family: var(--serif); font-weight: 700; font-size: 42px; line-height: 1.12; color: var(--ink); }
      .dot .on { position: absolute; inset: -6px; border-radius: 50%; background: var(--ink); opacity: 0; }
      .dot .num { position: relative; z-index: 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="timeline" data-start="0" data-duration="6" data-width="940" data-height="720">
      <div id="shell">
        <div id="fit">
          <div id="stage">
            <div id="track"><div id="fill"></div></div>
            <div id="events"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="assets/kettek.js"></script>
    <script>
      KT.fit("#fit", 860, 720);
      var raw = KT.list("events").slice(0, 5);
      var events = raw.map(function (e) {
        return typeof e === "string" ? { when: "", what: e } : { when: String(e.when || ""), what: String(e.what || "") };
      });
      var n = Math.max(1, events.length);
      var gap = Math.min(150, 640 / n);
      var top0 = (720 - gap * (n - 1) - 120) / 2;
      var host = document.getElementById("events");
      events.forEach(function (e, i) {
        var d = document.createElement("div");
        d.className = "ev";
        d.id = "ev" + (i + 1);
        d.style.top = top0 + i * gap + "px";
        d.innerHTML = '<div class="dot"><div class="ring"></div><div class="on"></div><span class="num"></span></div><div class="txt"><div class="when"></div><div class="what"></div></div>';
        d.querySelector(".num").textContent = String(i + 1);
        d.querySelector(".when").textContent = e.when.toLocaleUpperCase("tr-TR");
        d.querySelector(".what").textContent = e.what;
        if (!e.when) d.querySelector(".when").style.display = "none";
        host.appendChild(d);
      });
      // Track spans first to last dot center
      var track = document.getElementById("track");
      track.style.top = top0 + 60 + "px";
      track.style.height = Math.max(1, gap * (n - 1)) + "px";

      // When each event lands: its cue, else evenly spread over the first ~75% of the scene
      var times = events.map(function (_, i) {
        var even = 0.4 + (i * Math.max(0.6, KT.dur * 0.75 - 0.4)) / n;
        return KT.cue("e" + (i + 1), even);
      });
      for (var i = 1; i < times.length; i++) times[i] = Math.max(times[i], times[i - 1] + 0.35);

      var tl = gsap.timeline({ paused: true });
      tl.set("#fill", { scaleY: 0 }, 0);
      tl.fromTo("#track", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
      events.forEach(function (_, i) {
        var t = times[i];
        var id = "#ev" + (i + 1);
        if (i > 0) tl.to("#fill", { scaleY: i / (n - 1), duration: Math.min(0.5, Math.max(0.2, t - times[i - 1] - 0.05)), ease: "power2.inOut" }, Math.max(0, t - 0.45));
        tl.fromTo(id + " .dot", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, t);
        tl.fromTo(id + " .txt", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, t + 0.08);
      });
      var active = Number(KT.vars.active === undefined ? n : KT.vars.active);
      if (active >= 1 && active <= n) {
        var ta = Math.min(KT.dur - 0.9, times[active - 1] + 0.6);
        var a = "#ev" + active;
        // immediateRender:false — these start late; without it GSAP would apply their start values at frame 0
        tl.fromTo(a + " .on", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out", immediateRender: false }, ta);
        var css = getComputedStyle(document.documentElement);
        tl.fromTo(a + " .num", { color: css.getPropertyValue("--ink").trim() }, { color: css.getPropertyValue("--surface").trim(), duration: 0.25, ease: "power1.out", immediateRender: false }, ta);
        tl.fromTo(a + " .ring", { opacity: 0.9, scale: 0.8 }, { opacity: 0, scale: 1.5, duration: 0.8, ease: "power2.out", immediateRender: false }, ta);
        tl.to(a + " .dot", { scale: 1.12, duration: 0.18, yoyo: true, repeat: 1, ease: "power1.inOut" }, ta);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["timeline"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
